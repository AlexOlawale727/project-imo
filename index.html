<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Ìmọ̀ — Offline Socratic Node</title>
    <style>
        :root {
            --bg-base: #090a0f;
            --bg-surface: #12151f;
            --bg-glass: rgba(18, 21, 31, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.25);
            --bubble-user: #1f293d;
            --bubble-bot: #121622;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #059669;
            --accent-glow: rgba(5, 150, 105, 0.15);
            --bubble-user: #e2e8f0;
            --bubble-bot: #f1f5f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-stack);
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            height: 60px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo-img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .brand h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .icon-btn:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        /* Main Workspace Layout */
        .app-container {
            display: flex;
            margin-top: 60px;
            height: calc(100vh - 60px);
            width: 100vw;
            position: relative;
        }

        /* Sidebar / Session Hub */
        sidebar {
            width: 280px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            z-index: 40;
            position: absolute;
            left: -280px;
            top: 0;
            bottom: 0;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        sidebar.open {
            left: 0;
        }

        @media(min-width: 768px) {
            sidebar {
                position: static;
                left: 0;
            }
        }

        .sidebar-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .track-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
        }

        .chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .subject-select {
            width: 100%;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .session-history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: var(--border-color);
            color: var(--text-main);
        }

        /* Chat Workspace */
        .chat-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-base);
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }

        .user .msg-bubble {
            background: var(--bubble-user);
            border-top-right-radius: 2px;
        }

        .bot .msg-bubble {
            background: var(--bubble-bot);
            border: 1px solid var(--border-color);
            border-top-left-radius: 2px;
        }

        .avatar-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent);
            flex-shrink: 0;
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Input Bar */
        .chat-input-area {
            padding: 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px 8px;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 14px;
        }

        .send-btn {
            background: var(--accent);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* Backdrop for mobile drawer */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 35;
        }
        .sidebar-backdrop.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <button class="icon-btn" id="menuToggle" aria-label="Toggle Menu">☰</button>
            <img src="logo.jpeg" alt="Project Imo Logo" class="brand-logo-img">
            <h1>Project Ìmọ̀</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" title="Toggle Theme">💡</button>
        </div>
    </header>

    <!-- Workspace Container -->
    <div class="app-container">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Sidebar / Exam & Session Hub -->
        <sidebar id="sidebar">
            <div>
                <div class="sidebar-section-title">Exam Track</div>
                <div class="track-chips" id="trackChips">
                    <div class="chip active" data-track="WAEC">WAEC</div>
                    <div class="chip" data-track="JAMB">JAMB</div>
                    <div class="chip" data-track="NECO">NECO</div>
                    <div class="chip" data-track="BECE">BECE</div>
                </div>
            </div>

            <div>
                <div class="sidebar-section-title">Subject Track</div>
                <select class="subject-select" id="subjectSelect">
                    <option value="Physics">Physics</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Economics">Economics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Biology">Biology</option>
                </select>
            </div>

            <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <div class="sidebar-section-title">Session Hub</div>
                <div class="session-history-list" id="sessionHistoryList">
                    <div class="history-item">Ohm's Law & Resistance</div>
                    <div class="history-item">Equilibrium Price</div>
                </div>
            </div>
        </sidebar>

        <!-- Chat Workspace -->
        <div class="chat-workspace">
            <div class="chat-messages" id="chatMessages">
                <!-- Welcome greeting with Ọyẹ́ Avatar -->
                <div class="message bot">
                    <img src="oye_avatar.jpeg" alt="Ọyẹ́" class="avatar-img">
                    <div class="msg-bubble">
                        Ẹ ńlẹ́ o! I am Ọ̀yẹ́, your Socratic study partner. Pick your exam track and subject on the left, then ask me anything. How can I help you learn today?
                    </div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <input type="text" class="chat-input" id="userInput" placeholder="Ask a question or request a concept..." autocomplete="off">
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let currentTrack = "WAEC";
        let currentSubject = "Physics";

        // DOM Elements
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const sidebarBackdrop = document.getElementById('sidebarBackdrop');
        const themeToggle = document.getElementById('themeToggle');
        const trackChips = document.querySelectorAll('.chip');
        const subjectSelect = document.getElementById('subjectSelect');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionHistoryList = document.getElementById('sessionHistoryList');

        // Toggle Sidebar on Mobile
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            sidebarBackdrop.classList.toggle('active');
        }
        menuToggle.addEventListener('click', toggleSidebar);
        sidebarBackdrop.addEventListener('click', toggleSidebar);

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            html.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
            themeToggle.textContent = currentTheme === 'dark' ? '🌙' : '💡';
        });

        // Track Selector Chips
        trackChips.forEach(chip => {
            chip.addEventListener('click', () => {
                trackChips.forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentTrack = chip.getAttribute('data-track');
            });
        });

        // Subject Selector
        subjectSelect.addEventListener('change', (e) => {
            currentSubject = e.target.value;
        });

        // Send Message Function
        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Bubble
            appendMessage(text, 'user');
            userInput.value = '';

            // Loading state placeholder
            const loadingId = appendMessage("Thinking...", 'bot', true);

            try {
                const response = await fetch('http://localhost:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        track: currentTrack,
                        subject: currentSubject
                    })
                });

                const data = await response.json();
                removeMessage(loadingId);
                appendMessage(data.reply || "No response received.", 'bot');
                
                // Add to session history list dynamically
                addHistoryItem(text);

            } catch (err) {
                removeMessage(loadingId);
                appendMessage("⚠️ Connection error: Make sure oye_engine.py is running on port 8000.", 'bot');
            }
        }

        function appendMessage(text, sender, isLoading = false) {
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now() + Math.random();
            msgDiv.id = msgId;
            msgDiv.className = `message ${sender}`;

            if (sender === 'user') {
                const avatar = document.createElement('div');
                avatar.className = 'user-avatar';
                avatar.textContent = 'U';
                msgDiv.appendChild(avatar);
            } else {
                const avatar = document.createElement('img');
                avatar.src = 'oye_avatar.jpeg';
                avatar.alt = 'Ọyẹ́';
                avatar.className = 'avatar-img';
                msgDiv.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.textContent = text;

            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return msgId;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function addHistoryItem(queryText) {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.textContent = queryText;
            item.onclick = () => {
                userInput.value = queryText;
                if (window.innerWidth < 768) toggleSidebar();
            };
            sessionHistoryList.prepend(item);
        }

        sendBtn.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });
    </script>
</body>
</html>
